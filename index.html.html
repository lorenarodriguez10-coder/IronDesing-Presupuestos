<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de Taller — Presupuestador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17140f;
    --surface: #211d16;
    --surface-2: #2b2620;
    --line: #3a3327;
    --wood: #c98a4b;
    --wood-dim: #8a6238;
    --steel: #aab0ae;
    --steel-dim: #565f5c;
    --text: #f1ece1;
    --muted: #a89d89;
    --danger: #c1502e;
    --success: #7c9473;
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(201,138,75,0.05), transparent 40%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding-bottom: 60px;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  header.top{
    padding: 28px 20px 20px;
    border-bottom: 2px solid var(--line);
    display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  header.top .brand{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size: 26px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text);
  }
  header.top .brand span{ color: var(--wood); }
  header.top .sub{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }
  nav.tabs{
    display:flex;
    gap: 2px;
    padding: 0 20px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  nav.tabs button{
    font-family:'Oswald', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--line);
    border-bottom: none;
    padding: 10px 18px;
    cursor: pointer;
    position: relative;
    top: 1px;
  }
  nav.tabs button.active{
    background: var(--surface-2);
    color: var(--wood);
    border-color: var(--wood-dim);
    border-bottom: 1px solid var(--surface-2);
  }
  main{
    max-width: 980px;
    margin: 0 auto;
    padding: 24px 20px 0;
  }
  .panel{
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 20px;
  }
  .panel h2{
    font-family:'Oswald', sans-serif;
    font-size: 15px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--steel);
    margin: 0 0 16px;
    padding-bottom: 10px;
    border-bottom: 1px dashed var(--line);
  }
  .row{ display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  .field{ display:flex; flex-direction:column; gap:5px; flex: 1 1 140px; }
  .field label{ font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--muted); }
  input, select{
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 9px 10px;
    border-radius: var(--radius);
    font-family:'Inter', sans-serif;
    font-size: 14px;
  }
  input:focus, select:focus{ outline: none; border-color: var(--wood-dim); }
  button.action{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    letter-spacing:0.6px;
    text-transform:uppercase;
    font-size: 12.5px;
    background: var(--wood-dim);
    color: #1a1510;
    border: none;
    padding: 10px 16px;
    border-radius: var(--radius);
    cursor:pointer;
  }
  button.action:hover{ background: var(--wood); }
  button.ghost{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
  }
  button.ghost:hover{ border-color: var(--steel-dim); color: var(--steel); }
  button.danger{ background: transparent; border:1px solid var(--danger); color: var(--danger); }
  button.danger:hover{ background: var(--danger); color: #1a1510; }
  button.small{ padding: 6px 10px; font-size: 11px; }

  /* Material tag look */
  .tag-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 12px; margin-top: 16px; }
  .tag{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 14px 12px;
    position: relative;
    cursor: pointer;
  }
  .tag::before{
    content:'';
    position:absolute; top:10px; left:10px;
    width:8px; height:8px; border-radius:50%;
    border: 1.5px solid var(--steel-dim);
    background: var(--bg);
  }
  .tag .nombre{ font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; margin-left:20px; }
  .tag .costo{ font-family:'IBM Plex Mono',monospace; color:var(--wood); font-size:15px; margin-top:8px; }
  .tag .unidad{ color:var(--muted); font-size:11px; text-transform:uppercase; }
  .tag .del{ position:absolute; top:8px; right:8px; color:var(--muted); background:none; border:none; cursor:pointer; font-size:14px; }
  .tag .del:hover{ color: var(--danger); }

  .empty{ color: var(--muted); font-size: 13px; padding: 20px 0; text-align:center; border: 1px dashed var(--line); border-radius: var(--radius); }

  table{ width:100%; border-collapse: collapse; margin-top: 14px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); padding: 8px 8px; border-bottom: 1px solid var(--line); }
  td{ padding: 9px 8px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  td.num, th.num{ text-align:right; font-family:'IBM Plex Mono',monospace; }
  td input{ width: 90px; padding: 6px 8px; font-size:13px; }

  .plantilla-card{ background: var(--surface); border:1px solid var(--line); border-radius: var(--radius); padding:16px; margin-top:14px; }
  .plantilla-card .head{ display:flex; justify-content:space-between; align-items:center; }
  .plantilla-card .head .nombre{ font-family:'Oswald',sans-serif; font-weight:600; font-size:15px; }
  .plantilla-card .head .tipo{ color:var(--wood); font-size:11px; text-transform:uppercase; letter-spacing:0.5px; margin-left:8px; }
  .item-line{ display:flex; gap:10px; align-items:center; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13px; flex-wrap:wrap; }
  .item-line .et{ flex:1; min-width:140px; }
  .item-line .calc-badge{ font-family:'IBM Plex Mono',monospace; font-size:11px; background: var(--bg); border:1px solid var(--line); padding:3px 7px; border-radius: var(--radius); color: var(--steel); }

  /* Budget ticket */
  .ticket{
    background: var(--surface);
    border: 1px solid var(--line);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    padding: 20px;
    position: relative;
  }
  .ticket-perforation{
    height: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: var(--radius) var(--radius) 0 0;
    background-image: radial-gradient(circle, var(--bg) 3px, transparent 3.5px);
    background-size: 18px 18px;
    background-position: 9px 0;
  }
  .total-line{ display:flex; justify-content:space-between; padding: 8px 0; font-size: 14px; }
  .total-line.grand{ border-top: 2px solid var(--wood-dim); margin-top:8px; padding-top:14px; font-family:'Oswald',sans-serif; font-weight:600; font-size:19px; color: var(--wood); }
  .total-line .amt{ font-family:'IBM Plex Mono',monospace; }

  .hist-item{ display:flex; justify-content:space-between; align-items:center; padding: 12px 0; border-bottom: 1px solid var(--line); cursor:pointer; }
  .hist-item:hover{ background: rgba(255,255,255,0.02); }
  .hist-item .nombre{ font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; }
  .hist-item .fecha{ color:var(--muted); font-size:11px; }
  .hist-item .total{ font-family:'IBM Plex Mono',monospace; color:var(--wood); font-size:15px; }

  .toast{
    position: fixed; bottom: 20px; left:50%; transform: translateX(-50%);
    background: var(--surface-2); border:1px solid var(--wood-dim); color: var(--text);
    padding: 10px 18px; border-radius: var(--radius); font-size:13px; z-index: 999;
    opacity:0; pointer-events:none; transition: opacity 0.25s ease;
  }
  .toast.show{ opacity:1; }
  .hint{ color: var(--muted); font-size: 12px; margin-top: 4px; }
  .cols2{ display:grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 700px){ .cols2{ grid-template-columns: 1fr; } }

  .confirm-overlay{
    position: fixed; inset:0; background: rgba(10,9,7,0.72);
    display:flex; align-items:center; justify-content:center; z-index: 1000;
  }
  .confirm-box{
    background: var(--surface-2); border:1px solid var(--wood-dim); border-radius: var(--radius);
    padding: 22px; max-width: 320px; text-align:center;
  }
  .confirm-box p{ margin: 0 0 16px; font-size: 14px; }
  .confirm-actions{ display:flex; gap:10px; justify-content:center; }
  .tag .piezas{ font-size: 11px; color: var(--muted); margin-top: 3px; }
</style>
</head>
<body>
<header class="top">
  <div>
    <div class="brand">Ficha de <span>Taller</span></div>
    <div class="sub">MATERIALES · PLANTILLAS · PRESUPUESTOS — datos compartidos entre dispositivos</div>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<main id="main"></main>

<div class="toast" id="toast"></div>

<!-- Firebase SDK (versión "compat", no necesita herramientas de build) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
// ============================================================
// PEGÁ ACÁ TU CONFIGURACIÓN DE FIREBASE (Project settings > General > Tus apps > Configuración del SDK)
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyCJGCBFQ-6IEF3rmsCO3G6KZ7A3VcURrCs",
  authDomain: "iron-desing---presupuestos.firebaseapp.com",
  projectId: "iron-desing---presupuestos",
  storageBucket: "iron-desing---presupuestos.firebasestorage.app",
  messagingSenderId: "252111125842",
  appId: "1:252111125842:web:6afaa6f670752835330e8b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const FIREBASE_CONFIGURADO = firebaseConfig.apiKey !== "PEGA_TU_API_KEY_ACA";
</script>
<script>
const KEYS = { materiales: 'materiales-list', plantillas: 'plantillas-list', presupuestos: 'presupuestos-list' };
const UNIDADES = ['m', 'm2', 'm3', 'kg', 'unidad', 'litro', 'hora'];
const TIPOS_MUEBLE = ['Mesa', 'Silla', 'Estantería', 'Placard', 'Otro'];
const CALCULOS = [
  { v:'largo', label:'Lineal (largo)' },
  { v:'ancho', label:'Lineal (ancho)' },
  { v:'alto', label:'Lineal (alto)' },
  { v:'area', label:'Área (largo × ancho)' },
  { v:'volumen', label:'Volumen (largo × ancho × alto)' },
  { v:'fijo', label:'Cantidad fija (manual)' },
];

let state = {
  tab: 'materiales',
  materiales: [],
  plantillas: [],
  presupuestos: [],
  loaded: false,
  editingMaterialId: null,
  plantillaBuilder: { nombre:'', tipo:'Mesa', items: [] },
  editingPlantillaId: null,
  presupuestoActual: null,
  viewingHistorial: null,
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function money(n){ return '$' + (Math.round((n||0)*100)/100).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2}); }

function showConfirm(message, onYes){
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = `
    <div class="confirm-box">
      <p>${escapeHtml(message)}</p>
      <div class="confirm-actions">
        <button class="ghost action" id="conf-cancel">Cancelar</button>
        <button class="danger action" id="conf-yes">Eliminar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.remove(); });
  overlay.querySelector('#conf-cancel').onclick = ()=> overlay.remove();
  overlay.querySelector('#conf-yes').onclick = ()=> { overlay.remove(); onYes(); };
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

async function storageSet(key, value){
  try{
    await db.collection('taller-datos').doc(key).set({ items: value });
    return true;
  }catch(e){ console.error(e); showToast('Error guardando datos (revisá la conexión a Firebase)'); return false; }
}

let _loadedCount = 0;
function checkAllLoaded(){
  _loadedCount++;
  if(_loadedCount >= 3 && !state.loaded){ state.loaded = true; }
  render();
}

function loadAll(){
  db.collection('taller-datos').doc(KEYS.materiales).onSnapshot(doc => {
    state.materiales = doc.exists ? (doc.data().items || []) : [];
    checkAllLoaded();
  }, err => { console.error(err); showToast('No se pudo conectar a Firebase'); });

  db.collection('taller-datos').doc(KEYS.plantillas).onSnapshot(doc => {
    state.plantillas = doc.exists ? (doc.data().items || []) : [];
    checkAllLoaded();
  }, err => console.error(err));

  db.collection('taller-datos').doc(KEYS.presupuestos).onSnapshot(doc => {
    state.presupuestos = doc.exists ? (doc.data().items || []) : [];
    checkAllLoaded();
  }, err => console.error(err));
}

function setTab(tab){ state.tab = tab; state.editingMaterialId = null; render(); }

/* ---------- MATERIALES ---------- */
function renderMateriales(){
  const editing = state.materiales.find(m => m.id === state.editingMaterialId);
  return `
    <div class="panel">
      <h2>${editing ? 'Editar material' : 'Nuevo material'}</h2>
      <div class="row">
        <div class="field">
          <label>Nombre</label>
          <input id="m-nombre" placeholder="Ej: Tabla de roble 2.4m" value="${editing ? escapeHtml(editing.nombre) : ''}">
        </div>
        <div class="field">
          <label>Unidad</label>
          <select id="m-unidad">
            ${UNIDADES.map(u => `<option value="${u}" ${editing && editing.unidad===u ? 'selected':''}>${u}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Costo por unidad</label>
          <input id="m-costo" type="number" step="0.01" min="0" placeholder="0.00" value="${editing ? editing.costo : ''}">
        </div>
      </div>
      <div class="row" style="margin-top:12px;">
        <div class="field">
          <label>Largo de la pieza (m) — opcional</label>
          <input id="m-largo" type="number" step="0.001" min="0" placeholder="Ej: 1.20" value="${editing && editing.piezaLargo ? editing.piezaLargo : ''}">
        </div>
        <div class="field">
          <label>Ancho de la pieza (m) — opcional</label>
          <input id="m-ancho" type="number" step="0.001" min="0" placeholder="Ej: 0.60" value="${editing && editing.piezaAncho ? editing.piezaAncho : ''}">
        </div>
        <div class="field" style="flex: 0 0 auto;">
          <button class="action" onclick="saveMaterial()">${editing ? 'Guardar cambios' : 'Agregar material'}</button>
        </div>
        ${editing ? `<div class="field" style="flex:0 0 auto;"><button class="ghost action" onclick="cancelEditMaterial()">Cancelar</button></div>` : ''}
      </div>
      <div class="hint">Cargá estas medidas solo si el material se compra en piezas de tamaño fijo (una tabla, un caño, una plancha). Así el sistema calcula cuántas piezas enteras hacen falta según las medidas del mueble, en vez de solo el área o largo total.</div>
    </div>
    <div class="panel">
      <h2>Materiales cargados (${state.materiales.length})</h2>
      ${state.materiales.length === 0 ? '<div class="empty">Todavía no cargaste materiales. Sumá el primero arriba.</div>' : `
      <div class="tag-grid">
        ${state.materiales.map(m => `
          <div class="tag" onclick="editMaterial('${m.id}')">
            <button class="del" onclick="event.stopPropagation(); deleteMaterial('${m.id}')">✕</button>
            <div class="nombre">${escapeHtml(m.nombre)}</div>
            <div class="costo">${money(m.costo)}<span class="unidad"> / ${m.unidad}</span></div>
            ${m.piezaLargo ? `<div class="piezas">pieza: ${m.piezaLargo}m × ${m.piezaAncho||'-'}m</div>` : ''}
          </div>
        `).join('')}
      </div>`}
    </div>
  `;
}

function escapeHtml(s){ const d=document.createElement('div'); d.textContent = s||''; return d.innerHTML; }

async function saveMaterial(){
  const nombre = document.getElementById('m-nombre').value.trim();
  const unidad = document.getElementById('m-unidad').value;
  const costo = parseFloat(document.getElementById('m-costo').value);
  const piezaLargo = parseFloat(document.getElementById('m-largo').value) || null;
  const piezaAncho = parseFloat(document.getElementById('m-ancho').value) || null;
  if(!nombre || isNaN(costo) || costo < 0){ showToast('Completá nombre y costo válido'); return; }
  if(state.editingMaterialId){
    const idx = state.materiales.findIndex(m=>m.id===state.editingMaterialId);
    state.materiales[idx] = { ...state.materiales[idx], nombre, unidad, costo, piezaLargo, piezaAncho };
    state.editingMaterialId = null;
  } else {
    state.materiales.push({ id: uid(), nombre, unidad, costo, piezaLargo, piezaAncho });
  }
  await storageSet(KEYS.materiales, state.materiales);
  showToast('Material guardado');
  render();
}
function editMaterial(id){ state.editingMaterialId = id; render(); }
function cancelEditMaterial(){ state.editingMaterialId = null; render(); }
function deleteMaterial(id){
  showConfirm('¿Eliminar este material?', async ()=>{
    state.materiales = state.materiales.filter(m=>m.id!==id);
    await storageSet(KEYS.materiales, state.materiales);
    showToast('Material eliminado');
    render();
  });
}

/* ---------- PLANTILLAS ---------- */
function renderPlantillas(){
  const b = state.plantillaBuilder;
  const editando = !!state.editingPlantillaId;
  return `
    <div class="panel">
      <h2>${editando ? 'Editar plantilla' : 'Nueva plantilla de mueble'}</h2>
      <div class="row">
        <div class="field">
          <label>Nombre de la plantilla</label>
          <input id="p-nombre" placeholder="Ej: Consola recibidor 1.20m" value="${escapeHtml(b.nombre)}">
        </div>
        <div class="field">
          <label>Tipo</label>
          <select id="p-tipo">
            ${TIPOS_MUEBLE.map(t => `<option value="${t}" ${b.tipo===t?'selected':''}>${t}</option>`).join('')}
          </select>
        </div>
      </div>

      <h2 style="margin-top:22px;">Ítems de materiales</h2>
      ${b.items.length === 0 ? '<div class="empty">Agregá materiales y cómo se calcula su cantidad según las medidas.</div>' : b.items.map((it,i) => `
        <div class="item-line">
          <div class="et">${escapeHtml(materialName(it.materialId))}</div>
          <span class="calc-badge">${CALCULOS.find(c=>c.v===it.calculo).label}</span>
          <span class="calc-badge">factor ${it.factor}</span>
          <button class="ghost small" onclick="removePlantillaItem(${i})">Quitar</button>
        </div>
      `).join('')}

      <div class="row" style="margin-top:14px;">
        <div class="field">
          <label>Material</label>
          <select id="pi-material">
            ${state.materiales.length === 0 ? '<option value="">Cargá materiales primero</option>' : state.materiales.map(m=>`<option value="${m.id}">${escapeHtml(m.nombre)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Cómo se calcula</label>
          <select id="pi-calculo">
            ${CALCULOS.map(c=>`<option value="${c.v}">${c.label}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Factor / cantidad</label>
          <input id="pi-factor" type="number" step="0.01" value="1">
        </div>
        <div class="field" style="flex:0 0 auto;">
          <button class="action ghost" onclick="addPlantillaItem()">+ Agregar ítem</button>
        </div>
      </div>
      <div class="hint">Ej: para la tabla superior de una mesa elegí "Área" con factor 1.1 (10% de merma). Para las 4 patas, elegí "Cantidad fija" con factor 4. Si el material tiene cargadas las medidas de la pieza (en Materiales), acá se calculan directamente cuántas piezas enteras hacen falta.</div>

      <div class="row" style="margin-top:18px;">
        <button class="action" onclick="savePlantilla()">${editando ? 'Guardar cambios' : 'Guardar plantilla'}</button>
        ${editando ? `<button class="ghost action" onclick="cancelEditPlantilla()">Cancelar</button>` : ''}
      </div>
    </div>

    <div class="panel">
      <h2>Plantillas guardadas (${state.plantillas.length})</h2>
      ${state.plantillas.length === 0 ? '<div class="empty">Todavía no hay plantillas guardadas.</div>' : state.plantillas.map(pl => `
        <div class="plantilla-card">
          <div class="head">
            <div><span class="nombre">${escapeHtml(pl.nombre)}</span><span class="tipo">${pl.tipo}</span></div>
            <div style="display:flex; gap:8px;">
              <button class="ghost small" onclick="editPlantilla('${pl.id}')">Editar</button>
              <button class="danger small" onclick="deletePlantilla('${pl.id}')">Eliminar</button>
            </div>
          </div>
          ${pl.items.map(it => `<div class="item-line"><div class="et">${escapeHtml(materialName(it.materialId))}</div><span class="calc-badge">${CALCULOS.find(c=>c.v===it.calculo).label}</span><span class="calc-badge">factor ${it.factor}</span></div>`).join('')}
        </div>
      `).join('')}
    </div>
  `;
}
function materialName(id){ const m = state.materiales.find(m=>m.id===id); return m ? m.nombre + ' (' + m.unidad + ')' : '(material eliminado)'; }

function addPlantillaItem(){
  const materialId = document.getElementById('pi-material').value;
  const calculo = document.getElementById('pi-calculo').value;
  const factor = parseFloat(document.getElementById('pi-factor').value);
  if(!materialId){ showToast('Elegí un material'); return; }
  if(isNaN(factor) || factor <= 0){ showToast('Factor inválido'); return; }
  state.plantillaBuilder.nombre = document.getElementById('p-nombre').value;
  state.plantillaBuilder.tipo = document.getElementById('p-tipo').value;
  state.plantillaBuilder.items.push({ materialId, calculo, factor });
  render();
}
function removePlantillaItem(i){ state.plantillaBuilder.items.splice(i,1); render(); }

async function savePlantilla(){
  const nombre = document.getElementById('p-nombre').value.trim();
  const tipo = document.getElementById('p-tipo').value;
  const items = state.plantillaBuilder.items;
  if(!nombre){ showToast('Ponele un nombre a la plantilla'); return; }
  if(items.length === 0){ showToast('Agregá al menos un ítem de material'); return; }
  if(state.editingPlantillaId){
    const idx = state.plantillas.findIndex(p=>p.id===state.editingPlantillaId);
    if(idx > -1) state.plantillas[idx] = { ...state.plantillas[idx], nombre, tipo, items };
    state.editingPlantillaId = null;
    showToast('Plantilla actualizada');
  } else {
    state.plantillas.push({ id: uid(), nombre, tipo, items });
    showToast('Plantilla guardada');
  }
  await storageSet(KEYS.plantillas, state.plantillas);
  state.plantillaBuilder = { nombre:'', tipo:'Mesa', items: [] };
  render();
}
function editPlantilla(id){
  const pl = state.plantillas.find(p=>p.id===id);
  if(!pl) return;
  state.editingPlantillaId = id;
  state.plantillaBuilder = { nombre: pl.nombre, tipo: pl.tipo, items: JSON.parse(JSON.stringify(pl.items)) };
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function cancelEditPlantilla(){
  state.editingPlantillaId = null;
  state.plantillaBuilder = { nombre:'', tipo:'Mesa', items: [] };
  render();
}
function deletePlantilla(id){
  showConfirm('¿Eliminar esta plantilla?', async ()=>{
    state.plantillas = state.plantillas.filter(p=>p.id!==id);
    await storageSet(KEYS.plantillas, state.plantillas);
    showToast('Plantilla eliminada');
    render();
  });
}

/* ---------- PRESUPUESTO ---------- */
function calcCantidad(calculo, factor, medidas, mat){
  const largo = parseFloat(medidas.largo)||0, ancho = parseFloat(medidas.ancho)||0, alto = parseFloat(medidas.alto)||0;
  let base = 0;
  if(calculo==='largo') base = largo;
  else if(calculo==='ancho') base = ancho;
  else if(calculo==='alto') base = alto;
  else if(calculo==='area') base = largo*ancho;
  else if(calculo==='volumen') base = largo*ancho*alto;
  else if(calculo==='fijo') base = 1;

  const necesidad = factor * base;
  if(calculo === 'fijo') return Math.round(necesidad*1000)/1000;

  // Si el material se compra en piezas de tamaño fijo, calculamos cuántas piezas ENTERAS hacen falta
  if(mat && mat.piezaLargo){
    let cobertura;
    if(calculo === 'area') cobertura = mat.piezaLargo * (mat.piezaAncho || mat.piezaLargo);
    else cobertura = mat.piezaLargo; // largo / ancho / alto (lineal) y volumen usan solo el largo de la pieza
    if(cobertura > 0) return Math.ceil(necesidad / cobertura);
  }
  return Math.round(necesidad*1000)/1000;
}

function renderPresupuesto(){
  const p = state.presupuestoActual;
  return `
    <div class="panel">
      <h2>Datos del proyecto</h2>
      <div class="cols2">
        <div class="field">
          <label>Nombre / cliente</label>
          <input id="pr-nombre" value="${p ? escapeHtml(p.nombre) : ''}" placeholder="Ej: Mesa de luz - Cliente García">
        </div>
        <div class="field">
          <label>Plantilla</label>
          <select id="pr-plantilla" onchange="onPlantillaChange()">
            <option value="">Cargar medidas sin plantilla</option>
            ${state.plantillas.map(pl => `<option value="${pl.id}" ${p && p.plantillaId===pl.id ? 'selected':''}>${escapeHtml(pl.nombre)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="row" style="margin-top:14px;">
        <div class="field"><label>Largo (m)</label><input id="pr-largo" type="number" step="0.01" value="${p ? p.medidas.largo : ''}"></div>
        <div class="field"><label>Ancho (m)</label><input id="pr-ancho" type="number" step="0.01" value="${p ? p.medidas.ancho : ''}"></div>
        <div class="field"><label>Alto (m)</label><input id="pr-alto" type="number" step="0.01" value="${p ? p.medidas.alto : ''}"></div>
        <div class="field" style="flex:0 0 auto;"><button class="action" onclick="calcularPresupuesto()">Calcular</button></div>
      </div>
    </div>

  `;
}

function onPlantillaChange(){
  // just triggers recalculation on next "Calcular" click; nothing to do here
}

function shapeKey(calculo){
  if(calculo==='largo'||calculo==='ancho'||calculo==='alto') return 'lineal';
  if(calculo==='area') return 'area';
  if(calculo==='volumen') return 'volumen';
  return null; // 'fijo' no se agrupa
}

function calcularPresupuesto(){
  const nombre = document.getElementById('pr-nombre').value.trim() || 'Presupuesto sin nombre';
  const plantillaId = document.getElementById('pr-plantilla').value;
  const medidas = {
    largo: document.getElementById('pr-largo').value,
    ancho: document.getElementById('pr-ancho').value,
    alto: document.getElementById('pr-alto').value,
  };
  const plantilla = state.plantillas.find(pl => pl.id === plantillaId);
  let items = [];
  if(plantilla){
    const largo = parseFloat(medidas.largo)||0, ancho = parseFloat(medidas.ancho)||0, alto = parseFloat(medidas.alto)||0;
    const grupos = {}; // clave: materialId|shape -> { mat, shape, necesidad, detalle: [] }
    const sueltos = []; // items que no se agrupan (fijo, o material sin medida de pieza)

    plantilla.items.forEach(it => {
      const mat = state.materiales.find(m=>m.id===it.materialId);
      const shape = shapeKey(it.calculo);
      const agrupable = mat && mat.piezaLargo && shape;

      if(agrupable){
        let base = 0;
        if(it.calculo==='largo') base = largo;
        else if(it.calculo==='ancho') base = ancho;
        else if(it.calculo==='alto') base = alto;
        else if(it.calculo==='area') base = largo*ancho;
        else if(it.calculo==='volumen') base = largo*ancho*alto;
        const necesidad = it.factor * base;
        const key = it.materialId + '|' + shape;
        if(!grupos[key]) grupos[key] = { mat, shape, necesidad: 0, detalle: [] };
        grupos[key].necesidad += necesidad;
        grupos[key].detalle.push(`${CALCULOS.find(c=>c.v===it.calculo).label} ×${it.factor} = ${necesidad.toFixed(2)}${shape==='area'?'m²':'m'}`);
      } else {
        const cantidad = calcCantidad(it.calculo, it.factor, medidas, mat);
        sueltos.push({
          materialId: it.materialId,
          nombre: mat ? mat.nombre : '⚠ MATERIAL BORRADO — revisá esta plantilla',
          unidad: mat ? mat.unidad : '',
          cantidad,
          costoUnit: mat ? mat.costo : 0,
          detalle: null,
        });
      }
    });

    const agrupados = Object.values(grupos).map(g => {
      let cobertura;
      if(g.shape === 'area') cobertura = g.mat.piezaLargo * (g.mat.piezaAncho || g.mat.piezaLargo);
      else cobertura = g.mat.piezaLargo;
      const unidadMedida = g.shape==='area' ? 'm²' : 'm';
      const piezasComprar = cobertura > 0 ? Math.ceil(g.necesidad / cobertura) : 1;
      const sobrante = cobertura > 0 ? (piezasComprar*cobertura - g.necesidad) : 0;
      const costoPorUnidad = cobertura > 0 ? g.mat.costo / cobertura : g.mat.costo;
      const cantidadReal = Math.round(g.necesidad*1000)/1000;
      return {
        materialId: g.mat.id,
        nombre: g.mat.nombre,
        unidad: unidadMedida,
        cantidad: cantidadReal,
        costoUnit: Math.round(costoPorUnidad*100)/100,
        detalle: `${g.detalle.join(' + ')} = ${g.necesidad.toFixed(2)}${unidadMedida} usados · comprás ${piezasComprar} pieza(s) entera(s) de ${cobertura.toFixed(2)}${unidadMedida} (sobran ${sobrante.toFixed(2)}${unidadMedida} para otro trabajo)`,
      };
    });

    items = [...agrupados, ...sueltos];
  }
  state.presupuestoActual = {
    nombre, plantillaId, medidas, items,
    extras: state.presupuestoActual ? state.presupuestoActual.extras : [],
    manoObraPct: state.presupuestoActual ? state.presupuestoActual.manoObraPct : 100,
    impuestosPct: state.presupuestoActual ? state.presupuestoActual.impuestosPct : 34.4,
    extrasNetos: state.presupuestoActual ? state.presupuestoActual.extrasNetos : [],
  };
  render();
}

function renderTicket(p){
  const subtotalItems = p.items.reduce((s,it)=> s + it.cantidad*it.costoUnit, 0);
  const subtotalExtras = p.extras.reduce((s,it)=> s + it.cantidad*it.costoUnit, 0);
  const subtotalMateriales = subtotalItems + subtotalExtras;
  const manoObraPct = (p.manoObraPct === undefined || p.manoObraPct === null) ? 100 : p.manoObraPct;
  const impuestosPct = (p.impuestosPct === undefined || p.impuestosPct === null) ? 34.4 : p.impuestosPct;
  const manoObra = subtotalMateriales * (manoObraPct/100);
  const subtotalConManoObra = subtotalMateriales + manoObra;
  const impuestos = subtotalConManoObra * (impuestosPct/100);
  const extrasNetos = p.extrasNetos || [];
  const totalExtrasNetos = extrasNetos.reduce((s,it)=> s + it.monto, 0);
  const total = subtotalConManoObra + impuestos + totalExtrasNetos;
  return `
    <div class="ticket-perforation"></div>
    <div class="ticket">
      <h2 style="border:none; margin-bottom:4px;">${escapeHtml(p.nombre)}</h2>
      <div class="hint" style="margin-bottom:14px;">Medidas: ${p.medidas.largo||0}m × ${p.medidas.ancho||0}m × ${p.medidas.alto||0}m</div>
      <table>
        <thead><tr><th>Material</th><th class="num">Cant.</th><th class="num">Costo unit.</th><th class="num">Subtotal</th><th></th></tr></thead>
        <tbody>
          ${p.items.map((it,i) => `
            <tr ${!it.materialId || it.nombre.includes('BORRADO') ? 'style="background: rgba(193,80,46,0.12);"' : ''}>
              <td ${it.nombre.includes('BORRADO') ? 'style="color: var(--danger); font-weight:600;"' : ''}>${escapeHtml(it.nombre)} <span class="hint" style="display:inline">(${it.unidad})</span>${it.detalle ? `<div class="hint">${escapeHtml(it.detalle)}</div>` : ''}</td>
              <td class="num"><input type="number" step="0.01" value="${it.cantidad}" onchange="updateItemQty(${i}, this.value, false)"></td>
              <td class="num">${money(it.costoUnit)}</td>
              <td class="num">${money(it.cantidad*it.costoUnit)}</td>
              <td></td>
            </tr>`).join('')}
          ${p.extras.map((it,i) => `
            <tr>
              <td>${escapeHtml(it.nombre)} <span class="hint" style="display:inline">(extra)</span></td>
              <td class="num"><input type="number" step="0.01" value="${it.cantidad}" onchange="updateItemQty(${i}, this.value, true)"></td>
              <td class="num">${money(it.costoUnit)}</td>
              <td class="num">${money(it.cantidad*it.costoUnit)}</td>
              <td><button class="ghost small" onclick="removeExtra(${i})">✕</button></td>
            </tr>`).join('')}
        </tbody>
      </table>

      <div class="row" style="margin-top:16px;">
        <div class="field">
          <label>Agregar material extra</label>
          <select id="ex-material">
            ${state.materiales.map(m=>`<option value="${m.id}">${escapeHtml(m.nombre)}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="flex:0 0 100px;">
          <label>Cantidad</label>
          <input id="ex-cantidad" type="number" step="0.01" value="1">
        </div>
        <div class="field" style="flex:0 0 auto;">
          <button class="ghost action" onclick="addExtra()">+ Agregar</button>
        </div>
      </div>

      <div class="row" style="margin-top:18px; align-items:center;">
        <div class="field" style="flex:0 0 200px;">
          <label>Mano de obra (% sobre materiales)</label>
          <input id="pr-manoobra" type="number" step="0.1" value="${p.manoObraPct}" onchange="updateManoObra(this.value)">
        </div>
        <div class="field" style="flex:0 0 200px;">
          <label>Impuestos (% sobre materiales + mano de obra)</label>
          <input id="pr-impuestos" type="number" step="0.1" value="${p.impuestosPct}" onchange="updateImpuestos(this.value)">
        </div>
      </div>

      <h2 style="margin-top:20px;">Costo extra neto <span class="hint" style="display:inline; font-weight:400;">(se suma al final, sin mano de obra ni impuestos)</span></h2>
      ${extrasNetos.length === 0 ? '' : extrasNetos.map((it,i) => `
        <div class="total-line"><span>${escapeHtml(it.nombre)}</span><span class="amt">${money(it.monto)} <button class="ghost small" onclick="removeExtraNeto(${i})" style="margin-left:8px;">✕</button></span></div>
      `).join('')}
      <div class="row" style="margin-top:8px;">
        <div class="field">
          <label>Concepto</label>
          <input id="en-nombre" placeholder="Ej: Traslado especial, comisión">
        </div>
        <div class="field" style="flex:0 0 140px;">
          <label>Monto</label>
          <input id="en-monto" type="number" step="0.01" placeholder="0.00">
        </div>
        <div class="field" style="flex:0 0 auto;">
          <button class="ghost action" onclick="addExtraNeto()">+ Agregar</button>
        </div>
      </div>

      <div style="margin-top:18px; border-top:1px dashed var(--line); padding-top:10px;">
        <div class="total-line"><span>Subtotal materiales</span><span class="amt">${money(subtotalMateriales)}</span></div>
        <div class="total-line"><span>Mano de obra (${manoObraPct}%)</span><span class="amt">${money(manoObra)}</span></div>
        <div class="total-line"><span>Subtotal con mano de obra</span><span class="amt">${money(subtotalConManoObra)}</span></div>
        <div class="total-line"><span>Impuestos (${impuestosPct}%)</span><span class="amt">${money(impuestos)}</span></div>
        ${totalExtrasNetos > 0 ? `<div class="total-line"><span>Costos extra netos</span><span class="amt">${money(totalExtrasNetos)}</span></div>` : ''}
        <div class="total-line grand"><span>TOTAL</span><span class="amt">${money(total)}</span></div>
      </div>

      <div class="row" style="margin-top:18px;">
        <button class="action" onclick="guardarPresupuesto(${subtotalMateriales}, ${manoObra}, ${impuestos}, ${total})">Guardar presupuesto</button>
        <button class="ghost action" onclick="window.print()">Imprimir / Exportar</button>
      </div>
    </div>
  `;
}

function updateItemQty(i, value, isExtra){
  const v = parseFloat(value) || 0;
  if(isExtra) state.presupuestoActual.extras[i].cantidad = v;
  else state.presupuestoActual.items[i].cantidad = v;
  render();
}
function updateManoObra(value){ state.presupuestoActual.manoObraPct = parseFloat(value)||0; render(); }
function updateImpuestos(value){ state.presupuestoActual.impuestosPct = parseFloat(value)||0; render(); }
function addExtra(){
  const materialId = document.getElementById('ex-material').value;
  const cantidad = parseFloat(document.getElementById('ex-cantidad').value) || 1;
  const mat = state.materiales.find(m=>m.id===materialId);
  if(!mat) return;
  state.presupuestoActual.extras.push({ materialId, nombre: mat.nombre, unidad: mat.unidad, cantidad, costoUnit: mat.costo });
  render();
}
function removeExtra(i){ state.presupuestoActual.extras.splice(i,1); render(); }

function addExtraNeto(){
  const nombre = document.getElementById('en-nombre').value.trim();
  const monto = parseFloat(document.getElementById('en-monto').value);
  if(!nombre || isNaN(monto)){ showToast('Completá concepto y monto'); return; }
  if(!state.presupuestoActual.extrasNetos) state.presupuestoActual.extrasNetos = [];
  state.presupuestoActual.extrasNetos.push({ nombre, monto });
  render();
}
function removeExtraNeto(i){ state.presupuestoActual.extrasNetos.splice(i,1); render(); }

async function guardarPresupuesto(subtotalMateriales, manoObra, impuestos, total){
  const p = state.presupuestoActual;
  const registro = { id: uid(), fecha: new Date().toISOString(), ...p, subtotalMateriales, manoObra, impuestos, total };
  state.presupuestos.unshift(registro);
  await storageSet(KEYS.presupuestos, state.presupuestos);
  showToast('Presupuesto guardado en historial');
  render();
}

/* ---------- HISTORIAL ---------- */
function renderHistorial(){
  if(state.viewingHistorial){
    const p = state.presupuestos.find(x=>x.id===state.viewingHistorial);
    if(!p) { state.viewingHistorial = null; }
    else {
      return `
        <div class="panel">
          <button class="ghost action" onclick="state.viewingHistorial=null; render();">← Volver al historial</button>
        </div>
        ${renderTicket({...p})}
      `;
    }
  }
  return `
    <div class="panel">
      <h2>Historial de presupuestos (${state.presupuestos.length})</h2>
      ${state.presupuestos.length === 0 ? '<div class="empty">Todavía no guardaste ningún presupuesto.</div>' : state.presupuestos.map(p => `
        <div class="hist-item" onclick="verHistorial('${p.id}')">
          <div>
            <div class="nombre">${escapeHtml(p.nombre)}</div>
            <div class="fecha">${new Date(p.fecha).toLocaleDateString('es-AR')}</div>
          </div>
          <div class="total">${money(p.total)}</div>
        </div>
      `).join('')}
    </div>
  `;
}
function verHistorial(id){ state.viewingHistorial = id; render(); }

/* ---------- APP SHELL ---------- */
function render(){
  const tabsEl = document.getElementById('tabs');
  const mainEl = document.getElementById('main');
  const tabs = [
    ['materiales','Materiales'], ['plantillas','Plantillas'], ['presupuesto','Presupuesto'], ['historial','Historial']
  ];
  tabsEl.innerHTML = tabs.map(([id,label]) => `<button class="${state.tab===id?'active':''}" onclick="setTab('${id}')">${label}</button>`).join('');

  if(!state.loaded){ mainEl.innerHTML = '<div class="panel"><div class="empty">Cargando datos...</div></div>'; return; }

  if(state.tab==='materiales') mainEl.innerHTML = renderMateriales();
  else if(state.tab==='plantillas') mainEl.innerHTML = renderPlantillas();
  else if(state.tab==='presupuesto') mainEl.innerHTML = renderPresupuesto();
  else if(state.tab==='historial') mainEl.innerHTML = renderHistorial();
}

if(!FIREBASE_CONFIGURADO){
  render();
  document.getElementById('main').innerHTML = `
    <div class="panel">
      <h2>Falta configurar Firebase</h2>
      <p style="line-height:1.6;">Todavía no completaste los datos de tu proyecto de Firebase en el código (la constante <code>firebaseConfig</code>, cerca del principio del archivo). Sin eso, la app no puede guardar ni sincronizar datos.</p>
    </div>`;
} else {
  loadAll();
}
</script>
