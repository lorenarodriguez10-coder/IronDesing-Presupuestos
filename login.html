<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iron Design - Ingresar</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a1a;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .login-box {
    background: #242424;
    padding: 40px;
    border-radius: 8px;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  h1 {
    color: #fff;
    font-size: 22px;
    margin: 0 0 24px 0;
    text-align: center;
  }
  label {
    color: #ccc;
    font-size: 13px;
    display: block;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    border-radius: 4px;
    border: 1px solid #444;
    background: #1a1a1a;
    color: #fff;
    font-size: 14px;
  }
  input:focus {
    outline: none;
    border-color: #888;
  }
  button {
    width: 100%;
    padding: 12px;
    background: #444;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #555; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .password-wrap {
    position: relative;
  }
  .password-wrap input {
    padding-right: 44px;
  }
  #toggle-pass {
    position: absolute;
    right: 10px;
    top: 8px;
    width: auto;
    background: none;
    border: none;
    color: #999;
    font-size: 12px;
    padding: 4px 6px;
    cursor: pointer;
  }
  #toggle-pass:hover { background: none; color: #fff; }
  #error-msg {
    color: #ff6b6b;
    font-size: 13px;
    text-align: center;
    margin-top: 12px;
    min-height: 16px;
  }
</style>
</head>
<body>

<div class="login-box">
  <h1>Iron Design</h1>
  <form id="login-form">
    <label for="email">Usuario</label>
    <input type="email" id="email" required autocomplete="username">

    <label for="password">Contraseña</label>
    <div class="password-wrap">
      <input type="password" id="password" required autocomplete="current-password">
      <button type="button" id="toggle-pass">Ver</button>
    </div>

    <button type="submit" id="login-btn">Ingresar</button>
    <div id="error-msg"></div>
  </form>
</div>

<!-- Firebase SDK - misma versión que usa el resto del proyecto (v10.13.0 compat) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="js/config.js"></script>

<script>
  // OJO: cambiá "index.html" por el nombre real de tu página principal
  const PAGINA_PRINCIPAL = "index.html";

  const form = document.getElementById("login-form");
  const errorMsg = document.getElementById("error-msg");
  const loginBtn = document.getElementById("login-btn");
  const passInput = document.getElementById("password");
  const togglePass = document.getElementById("toggle-pass");

  togglePass.addEventListener("click", () => {
    const isHidden = passInput.type === "password";
    passInput.type = isHidden ? "text" : "password";
    togglePass.textContent = isHidden ? "Ocultar" : "Ver";
  });

  // Si ya está logueado, lo mandamos directo adentro
  firebase.auth().onAuthStateChanged((user) => {
    if (user) {
      window.location.href = PAGINA_PRINCIPAL;
    }
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    errorMsg.textContent = "";
    loginBtn.disabled = true;
    loginBtn.textContent = "Ingresando...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    firebase.auth().signInWithEmailAndPassword(email, password)
      .then(() => {
        window.location.href = PAGINA_PRINCIPAL;
      })
      .catch((error) => {
        loginBtn.disabled = false;
        loginBtn.textContent = "Ingresar";
        if (error.code === "auth/invalid-credential" || error.code === "auth/wrong-password" || error.code === "auth/user-not-found") {
          errorMsg.textContent = "Usuario o contraseña incorrectos.";
        } else if (error.code === "auth/too-many-requests") {
          errorMsg.textContent = "Demasiados intentos. Probá de nuevo en unos minutos.";
        } else {
          errorMsg.textContent = "Error al ingresar. Probá de nuevo.";
        }
      });
  });
</script>
</body>
</html>
